<!-- ===================== HERO ===================== -->
<section class="hero" id="hero">
  <div class="hero__grid-lines" aria-hidden="true"></div>
  <div class="hero__glow" aria-hidden="true"></div>
  <svg class="hero__pad" viewBox="0 0 64 64" fill="none" aria-hidden="true">
    <path d="M20 22h24a10 10 0 0 1 9.8 8l2.4 14a6 6 0 0 1-9.8 5.6L40 46H24l-6.4 3.6A6 6 0 0 1 7.8 44l2.4-14A10 10 0 0 1 20 22Z" stroke="currentColor" stroke-width="2.5"/>
    <path d="M20 31v8M16 35h8" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="43" cy="33" r="2.4" fill="currentColor"/>
    <circle cx="49" cy="39" r="2.4" fill="currentColor"/>
  </svg>
  <div class="container hero__content">
    <span class="pill reveal" id="heroKicker"></span>
    <h1 class="hero__title">
      <span id="heroLead"></span> <span class="grad" id="heroAccent"></span>
    </h1>
    <p class="hero__subtitle reveal" id="heroSubtitle"></p>
    <div class="hero__actions reveal">
      <a class="btn btn--accent btn--lg" id="heroPrimary"></a>
      <a class="btn btn--ghost btn--lg" id="heroSecondary"></a>
    </div>
    <div class="hero__logos reveal">
      <span class="hero__logos-label">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 12h4M8 10v4"/><circle cx="15" cy="11" r="1"/><circle cx="17.5" cy="13.5" r="1"/><path d="M17.5 6.5a5.5 5.5 0 0 1 5 5.4l.4 4.8a2.4 2.4 0 0 1-4.2 1.8L16.5 15h-9l-2.2 3.5A2.4 2.4 0 0 1 1 16.7l.5-4.8a5.5 5.5 0 0 1 5-5.4Z"/></svg>
        Powering</span>
      <span class="hero__logo-chip" data-c="#ff3d3d">GameTout</span>
      <span class="hero__logo-chip" data-c="#3d7bff">TheGameVoice</span>
    </div>
  </div>
  <div class="marquee" id="marquee" aria-hidden="true"></div>
</section>
