<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FLASHBANG MEDIA — A Gaming Media Company</title>
  <meta name="description" content="FLASHBANG MEDIA is a gaming media company connecting audiences, creators and developers through GameTout on YouTube and TheGameVoice online." />
  <meta name="theme-color" content="#0b0b0f" />
  <link rel="icon" type="image/png" href="assets/img/logo.png" />

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="FLASHBANG MEDIA" />
  <meta property="og:title" content="FLASHBANG MEDIA — A Gaming Media Company" />
  <meta property="og:description" content="Gaming media through GameTout on YouTube and TheGameVoice online." />
  <meta property="og:image" content="assets/img/hero.jpg" />
  <meta name="twitter:card" content="summary_large_image" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="assets/css/style.css?v=12" />
  <script>
    (function () {
      try {
        var t = localStorage.getItem("fb-theme") || "dark";
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) { document.documentElement.setAttribute("data-theme", "dark"); }
    })();
  </script>

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "FLASHBANG MEDIA PRIVATE LIMITED",
    "alternateName": "FLASHBANG MEDIA",
    "url": "https://flashbangmedia.com",
    "email": "contact@flashbangmedia.com",
    "logo": "assets/img/logo.png",
    "description": "FLASHBANG MEDIA is a gaming media company operating GameTout on YouTube and TheGameVoice online.",
    "sameAs": ["https://www.youtube.com/@GameTout", "https://thegamevoice.com"],
    "address": { "@type": "PostalAddress", "addressRegion": "West Bengal", "addressCountry": "IN" }
  }
  </script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <!-- Scroll progress indicator -->
  <div class="scroll-prog" id="scrollProg" aria-hidden="true"></div>

  <!-- Animated aurora background (pure CSS, behind all content) -->
  <div class="bg-fx" aria-hidden="true">
    <span class="bg-fx__blob b1"></span>
    <span class="bg-fx__blob b2"></span>
    <span class="bg-fx__blob b3"></span>
    <span class="bg-fx__grid"></span>
  </div>

  <!-- ====== Section partials are injected here by assets/js/include.js ====== -->
  <!-- Each section lives in its own file under /sections for easy maintenance. -->

  <div data-include="sections/nav.html"></div>

  <span id="top"></span>
  <main id="main">
    <div data-include="sections/hero.html"></div>
    <div data-include="sections/about.html"></div>
    <div data-include="sections/products.html"></div>
    <div data-include="sections/work-videos.html"></div>
    <div data-include="sections/work-articles.html"></div>
    <div data-include="sections/events.html"></div>
    <div data-include="sections/stats.html"></div>
    <div data-include="sections/mission-vision.html"></div>
    <div data-include="sections/contact.html"></div>
  </main>

  <div data-include="sections/footer.html"></div>
  <div data-include="sections/fab.html"></div>

  <!-- Data first, then the loader (which injects sections, then boots main.js + feeds.js) -->
  <script src="data/content.js?v=12"></script>
  <script src="assets/js/include.js?v=12"></script>
</body>
</html>
